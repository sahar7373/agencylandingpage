name: Build, prerender & deploy

# Replaces Cloudflare's own build step. Cloudflare's build image cannot launch
# Chromium (no libatk-1.0.so.0, no root to install it), so `npm run build:ssg`
# fails there. GitHub's ubuntu runner has the system libraries Puppeteer needs,
# so the prerender runs here and only the finished dist/ is shipped.
#
# Turn OFF the Cloudflare Git build integration once this is live, otherwise
# both pipelines race to deploy the same Worker.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Prerender and deploy to Cloudflare
    runs-on: ubuntu-latest
    # The whole job is ~2 min of real work. Without a cap, a hung prerender runs
    # against GitHub's 6-hour default — run 34747991654 sat idle for 60 minutes
    # after a successful 65-second prerender before it was cancelled by hand.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender
        run: npm run build:ssg
        timeout-minutes: 8

      # The whole point of this pipeline. If prerender silently no-ops we would
      # ship 40 copies of the homepage again, so fail loudly instead of deploying.
      - name: Verify prerender output
        run: npm run verify:prerender

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler is not a project dependency, so the action falls back to its
          # own default (3.90.0). That predates JSON/JSONC config support, added
          # in 3.91.0, so it silently ignored wrangler.jsonc, found no config and
          # failed with "Missing entry-point" despite `main` being set. Pin a
          # current wrangler that actually reads the config file we ship.
          wranglerVersion: "4.131.1"
          command: deploy

# The Google Indexing API job used to run here. Retired 2026-09-13: Google
# restricts that API to "pages with either JobPosting or BroadcastEvent embedded
# in a VideoObject", and none of our pages qualify, so it was failing the
# pipeline for a call that cannot legitimately index marketing pages anyway.
# scripts/index_pages.py and index-on-deploy.yml are kept for the day we ship
# JobPosting markup. Recrawl is driven by sitemap lastmod + GSC instead.
