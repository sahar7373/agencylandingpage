name: Index pages after Cloudflare deploy

# Called by deploy.yml once the Worker is live. The deployment_status trigger is
# kept for the legacy Cloudflare Git build integration — it stops firing once
# that integration is switched off, and can be dropped then.
on:
  deployment_status:
  workflow_call:

jobs:
  index:
    name: Submit sitemap URLs to Google Indexing API
    # Gate applies only to the deployment_status path; a workflow_call is always
    # deliberate and has no deployment_status payload to inspect.
    if: |
      github.event_name != 'deployment_status' || (
        github.event.deployment_status.state == 'success' &&
        (
          github.event.deployment_status.environment == 'Production' ||
          github.event.deployment_status.environment == 'production'
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet google-auth google-auth-oauthlib requests

      - name: Write credentials from secrets
        run: |
          mkdir -p ~/keys
          printf '%s' '${{ secrets.INDEXING_CLIENT_SECRET }}' > ~/keys/indexing_client_secret.json
          printf '%s' '${{ secrets.INDEXING_TOKEN }}'         > ~/keys/indexing_token.json

      - name: Run indexing script
        run: python scripts/index_pages.py

      - name: Upload indexing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexing-log-${{ github.run_number }}
          path: scripts/indexing_log.json
          retention-days: 30
